# Serveur live : MediaMTX (WebRTC < 1 s, HLS en secours, RTMP pour OBS).
# Lancement : docker compose up -d
name: v-live

services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.3
    container_name: v-mediamtx
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    environment:
      # IP annoncees aux navigateurs pour le WebRTC. Ajouter l'IP LAN du PC
      # (fichier .env a la racine : LIVE_PUBLIC_HOSTS=127.0.0.1,192.168.x.x) pour les telephones.
      MTX_WEBRTCADDITIONALHOSTS: ${LIVE_PUBLIC_HOSTS:-127.0.0.1}
    ports:
      - "8889:8889"          # WebRTC (signalisation WHIP/WHEP)
      - "8189:8189/udp"      # WebRTC media (UDP)
      - "8189:8189/tcp"      # WebRTC media (TCP, secours)
      - "8888:8888"          # HLS (secours)
      - "1935:1935"          # RTMP (OBS/Streamlabs)
      - "127.0.0.1:9997:9997" # API interne, lue par le backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
